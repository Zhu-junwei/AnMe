name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build userscript and extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build all artifacts
        run: npm run build

      - name: Verify artifacts
        shell: bash
        run: |
          test -f AnMe.user.js
          test -d dist/extension/chromium
          test -d dist/extension/firefox
          ls dist/packages/AnMe-chromium-*.zip
          ls dist/packages/AnMe-firefox-*.xpi

      - name: Upload userscript
        id: upload_userscript
        uses: actions/upload-artifact@v4
        with:
          name: AnMe.user.js
          path: AnMe.user.js
          if-no-files-found: error

      - name: Upload Chromium extension
        id: upload_chromium_extension
        uses: actions/upload-artifact@v4
        with:
          name: AnMe-chromium-extension
          path: dist/packages/AnMe-chromium-*.zip
          if-no-files-found: error

      - name: Upload Firefox extension
        id: upload_firefox_extension
        uses: actions/upload-artifact@v4
        with:
          name: AnMe-firefox-extension
          path: dist/packages/AnMe-firefox-*.xpi
          if-no-files-found: error

      - name: Add download links to summary
        run: |
          {
            echo "## Downloads"
            echo
            echo "- [AnMe.user.js](${{ steps.upload_userscript.outputs.artifact-url }})"
            echo "- [Chromium extension](${{ steps.upload_chromium_extension.outputs.artifact-url }})"
            echo "- [Firefox extension](${{ steps.upload_firefox_extension.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
