name: Build Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build userscript and extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Build all artifacts
        run: npm run build

      - name: Verify artifacts
        shell: bash
        run: |
          test -f AnMe.user.js
          test -d dist/extension/chromium
          test -d dist/extension/firefox
          ls dist/packages/AnMe-userscript-*.user.js
          ls dist/packages/AnMe-chromium-*.zip
          ls dist/packages/AnMe-firefox-*.xpi

      - name: Upload userscript
        uses: actions/upload-artifact@v4
        with:
          name: AnMe-userscript-${{ steps.package.outputs.version }}.user.js
          path: dist/packages/AnMe-userscript-*.user.js
          if-no-files-found: error

      - name: Upload Chromium extension
        uses: actions/upload-artifact@v4
        with:
          name: AnMe-chromium-${{ steps.package.outputs.version }}.zip
          path: dist/packages/AnMe-chromium-*.zip
          if-no-files-found: error

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: AnMe-firefox-${{ steps.package.outputs.version }}.xpi
          path: dist/packages/AnMe-firefox-*.xpi
          if-no-files-found: error
